sweep:
  id: k-epsilon closure c2 x c4 sensitivity (GLS.C2 vs structure.c4)
  base_config: configs/baseline.yaml
  apply_config: configs/variants/k-e_mixing_timescale.yaml

  # Companion to templates/gen_c2c4_sweep.yaml and templates/k-omega_c2c4_sweep.yaml
  # (see notes/c2_c4_closure_dependence.md), extended to the third GLS
  # closure variant available in this repo: k-epsilon (configs/variants/
  # k-e.yaml: P=3.0, M=1.5, N=-1.0, C1=1.44, C2=1.92 default, C3M=-0.63,
  # C3P=1.0, SIGK=2, SIGP=1.3).
  #
  # k-epsilon's own literature C2=1.92 is the *largest* value in the shared
  # C2 grid used for gen/k-omega -- both of those closures showed no
  # meaningful c4-sensitivity at C2>=1.6, so this sweep tests whether
  # k-epsilon's low-C2 behaviour (C2 grid extended down to 0.52, same grid
  # as gen/k-omega for direct comparability) reproduces the same collapse
  # danger-zone found in gen and k-omega, or whether k-epsilon's different
  # P/M/N/SIGK/SIGP background makes it more (or less) robust.
  #
  # GLS.C2 grid identical to the gen/k-omega sweeps. structure.c4 grid uses
  # the same 5 fractions of *this* closure's GLS.C1=1.44 (c4 must stay
  # <= GLS.C1, see notes/mixing_timescale_analysis.md section 4.3).
  parameters:
    structure.c4: [0.144, 0.432, 0.792, 1.152, 1.44]   # fractions of GLS.C1=1.44
    GLS.C2: [0.52, 0.833, 1.22, 1.6, 1.92]

  run_name_template: "ke_c2c4_c2{GLS.C2}_c4{structure.c4}"

  output_dir: "sweeps/k-e_c2c4"

  ntimes_margin: 4.0
