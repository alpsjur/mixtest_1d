# This is a test configuration file for the ROMS model, 
# specifically for testing the UV_BODYFORCE option in 
# force mode. This option is later used in 
# test_STRUCTURE_DRAG.py
# Running this should result in a uniform flow in the
# x-direction, with a velocity increasing linearly 
# in time, reaching 0.1 m/s after 1 day 
# of simulation time.

run:
  name: test_UV_BODYFORCE

structure:
  str_a: 0.0

bodyforce:
  mode: force
  F_U: 11.57e-7
  F_V: 0.0
  BFRC_CD: 0.0

time_stepping:
  NTIMES: 2160
