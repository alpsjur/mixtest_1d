# Variant for the floating-structure (spar / semisubmersible) depth-
# distribution exploration (see notes/floating_structure_depth_distribution.md).
#
# Builds on configs/variants/mixing_timescale.yaml (same inflated
# str_a/BFRC_U scaling for practical run durations, same u_inf~0.1 m/s
# background current). The one difference: NTIMES is fixed explicitly
# here (not overwritten per-run from analytic_mixing_timescale(), which
# assumes structure.depth_zero_below >= grid.H0 -- not true for the
# partial-depth "floating" structures explored here). The fixed value
# below is sized from the analytic tau_mix_theory of the *full-depth*
# reference case (str_a=0.01, CD=0.63, temp_dT=10, H0=150 -> tau_mix
# ~9.21 d) with a margin of 5x (46.08 d), so every run in these sweeps
# gets the same, generously-long absolute run duration -- needed because
# runs are compared directly in real (model) time, not via the t*
# normalization (which doesn't apply once structure.depth_zero_below is
# allowed to vary).

run:
  name: floating_structure_mixing

structure:
  str_a: 0.01
  depth_zero_below: 1.0e+9   # overridden per-run by the sweep scripts

bodyforce:
  BFRC_U: 315.0
  BFRC_V: 0.0

time_stepping:
  DT: 40.0
  NHIS: 90
  NTIMES: 99540   # 5x margin x analytic tau_mix_theory(full-depth reference) = 46.08 d

initial:
  ubar0: 0.1
