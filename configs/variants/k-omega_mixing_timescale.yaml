# Variant combining the k-omega closure coefficients (configs/variants/
# k-omega.yaml) with the mixing-timescale sweep setup (configs/variants/
# mixing_timescale.yaml, str_a/BFRC_U scaled up 100x so tau_mix ~ days
# instead of ~900 days). Kept as one file because
# tools/prep_mixing_timescale_sweep.py only accepts a single apply_config.
run:
  name: k-omega_mixing_timescale

GLS:        # k-omega closure (Warner et al. 2005, Table 1; Umlauf & Burchard 2003)
  P: -1.0
  M: 0.5
  N: -1.0
  # Kmin/Pmin left at baseline.yaml defaults -- see configs/variants/
  # k-omega.yaml for why overriding them with literature values breaks the
  # .in template's fixed "d-8" exponent convention.
  CMU0: 0.5477
  C1: 0.555
  C2: 0.833
  C3M: -0.6
  C3P: 1.0
  SIGK: 2.0
  SIGP: 2.0

structure:
  str_a: 0.01
  depth_zero_below: 1.0e+9

bodyforce:
  BFRC_U: 315.0
  BFRC_V: 0.0

time_stepping:
  DT: 40.0
  NHIS: 90
  NTIMES: 30240   # placeholder; overwritten per-run by prep_mixing_timescale_sweep.py

initial:
  ubar0: 0.1
