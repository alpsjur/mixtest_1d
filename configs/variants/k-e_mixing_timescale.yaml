# Variant combining the k-epsilon closure coefficients (configs/variants/
# k-e.yaml -- kept as-is for continuity with the existing k-e_sweep.yaml/
# sweeps/k-e_variations work: CMU0/Kmin/Pmin are NOT overridden here either,
# same rationale as configs/variants/k-omega_mixing_timescale.yaml) with the
# mixing-timescale sweep setup (configs/variants/mixing_timescale.yaml,
# str_a/BFRC_U scaled up 100x so tau_mix ~ days instead of ~900 days). Kept
# as one file because tools/prep_mixing_timescale_sweep.py only accepts a
# single apply_config.
run:
  name: k-e_mixing_timescale

GLS:        # k-epsilon closure
  P: 3.0
  M: 1.5
  N: -1.0
  CMU0: 0.5477
  C1: 1.44
  C2: 1.92
  C3M: -0.63
  C3P: 1.0
  SIGK: 2
  SIGP: 1.3

structure:
  str_a: 0.01
  depth_zero_below: 1.0e+9

bodyforce:
  BFRC_U: 315.0
  BFRC_V: 0.0

time_stepping:
  DT: 40.0
  NHIS: 90
  NTIMES: 30240   # placeholder; overwritten per-run by prep_mixing_timescale_sweep.py

initial:
  ubar0: 0.1
