# Test configuration for the STR_RAMP option of STRUCTURE_MIXING.
# Same setup as test_STRUCTURE_DRAG, but the structure drag is ramped up
# with a cosine factor over 540 steps (6 h at DT = 40 s).

run:
  name: test_STRUCTURE_RAMP

structure:
  str_a: 0.0001
  ramp: 10800 

bodyforce:
  mode: force
  F_U: 3.15e-7
  F_V: 0.0
  BFRC_CD: 0.0

time_stepping:
  NTIMES: 30240
