# This is a test configuration file for the ROMS model, 
# specifically for testing the drag part of STRUCTURE_MIXING option.
# Note that UV_BODYFORCE must be activated.
# Running this should result in flow in the
#  x-direction, with a mean velocity of 0.1 m/s when
# steady state is reached.
#
# Uses bodyforce.mode: force to apply a fixed acceleration directly
# (bypassing the velocity-target/BFRC_CD relation used elsewhere), with
# BFRC_CD: 0.0 so the new linear damping term vanishes and the response
# is governed purely by the quadratic STRUCTURE_MIXING drag, as before.

run:
  name: test_STRUCTURE_DRAG

structure:
  str_a: 0.0001

bodyforce:
  mode: force
  F_U: 3.15e-7
  F_V: 0.0
  BFRC_CD: 0.0

time_stepping:
  NTIMES: 30240
