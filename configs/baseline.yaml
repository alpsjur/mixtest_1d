run:
  name: baseline

files:
  grd: mixtest_1d_grd.nc
  ini: mixtest_1d_ini.nc
  his: mixtest_1d_his.nc

grid:
  Lm: 10
  Mm: 12
  N: 40
  H0: 150.0     # uniform depth (m)
  DX: 800.0     # grid spacing xi (m)
  DY: 800.0     # grid spacing eta (m)


ROMS:
  # yaml_loc is always overwritten by prep_experiment.py to <ROOT_DIR>/roms
  # (kept here only so the key exists before resolution).
  yaml_loc: null


GLS:            # gen closure
  P: 2.0
  M: 1.0
  N: -0.67
  Kmin: 1.0
  Pmin: 1.0
  CMU0: 0.527
  C1: 1.0
  C2: 1.22
  C3M: 0.05
  C3P : 1.0
  SIGK: 0.8
  SIGP: 1.07

vertical:
  Vtransform: 2
  Vstretching: 5
  THETA_S: 5.0
  THETA_B: 4.0
  HC: 100.0

time_stepping:
  NTIMES: 30240  # 60480 for month, 15120 for week, 2160 for day
  DT: 40.0
  NHIS: 90       # history every hour

phys:
  F0: 0       # Coriolis (s^-1)
  RDRG2: 0    # Quadratic bottom drag (e-3)

structure:
  str_a: 0.0001            
  depth_zero_below: 1.0e+9 # set to a large number to keep full column non-zero
  CD: 0.63
  c4: 0.44           # strong mixing

bodyforce:
  mode: uniform       # "uniform" (U0/V0 everywhere) or "profile" (depth-varying, from profile_file)
  U0: 0.1             # m/s, target steady-state velocity, x-direction (uniform mode)
  V0: 0.0             # m/s, target steady-state velocity, y-direction (uniform mode)
  profile_file: null  # path (repo-root-relative) to a depth,u[,v] text file (profile mode)
  BFRC_TSTR: 0.0      # days, ramp start
  BFRC_TEND: 0.0      # days, ramp end
  # Linear (Rayleigh) damping rate (1/s) that balances the prescribed
  # force in steady state (bfrc = BFRC_CD * u_target). Independent of
  # structure.CD (STRUCTURE_MIXING quadratic drag). Since this term is
  # explicit, it must satisfy BFRC_CD * DT << 1 for stability
  # (DT=40s here, so keep BFRC_CD well below ~0.02).
  BFRC_CD: 0.005


initial:
  ocean_time_seconds: 0.0   # time stamp for the IC file

  # Temperature profile. temp_mode: "tanh" (default, params below) or
  # "profile" (arbitrary depth-varying profile from a text file, columns
  # "depth  temp", depth positive down -- set temp_profile_file instead).
  temp_mode: tanh
  temp_T0: 20.0     # Surface temperatur
  temp_dT: 10.0    # temperature change across thermocline
  temp_zt: 40.0     # depth of thermocline center
  temp_ht: 10.0     # thickness of thermocline
  temp_profile_file: null   # used only if temp_mode == "profile"

  # Salinity (constant)
  salt_S0: 35.0

  # Initial velocity (u_3d/v_3d; ubar/vbar are derived as the vertical
  # mean). Independent of the UV_BODYFORCE target (bodyforce section
  # above) -- default here is "start from rest". To start already at
  # the body-force target/profile, mirror the bodyforce section (e.g.
  # same mode/U0/V0/profile_file).
  mode: uniform
  U0: 0.0
  V0: 0.0
  profile_file: null