run:
  name: baseline

ROMS: 
  yaml_loc: /home/ansju8054/Documents/Code/havvind-mix/mixtest_1d/roms

files:
  grd: mixtest_1d_grd.nc
  ini: mixtest_1d_ini.nc
  his: mixtest_1d_his.nc

grid:
  Lm: 10
  Mm: 12
  N: 40
  H0: 150.0     # uniform depth (m)
  DX: 800.0     # grid spacing xi (m)
  DY: 800.0     # grid spacing eta (m)

GLS:            # gen closure
  P: 2.0
  M: 1.0
  N: -0.67
  Kmin: 1.0
  Pmin: 1.0
  CMU0: 0.527
  C1: 1.0
  C2: 1.22
  C3M: 0.05
  C3P : 1.0
  SIGK: 0.8
  SIGP: 1.07

vertical:
  Vtransform: 2
  Vstretching: 5
  THETA_S: 5.0
  THETA_B: 4.0
  HC: 100.0

time_stepping:
  NTIMES: 30240  # 60480 for month, 15120 for week, 2160 for day
  DT: 40.0
  NHIS: 90       # history every hour

phys:
  F0: 0       # Coriolis (s^-1)
  RDRG2: 0    # Quadratic bottom drag (e-3)

structure:
  str_a: 0.0001            
  depth_zero_below: 1.0e9 # set to a large number to keep full column non-zero
  CD: 0.63
  c4: 0.44           # strong mixing

bodyforce:
  BFRC_U: 3.15        # e-7 m/s2, x-direction, corresponds to 0.1 m/s velocity in steady state
  BFRC_V: 0.0         # e-7 m/s2, y-direction 
  BFRC_TSTR: 0.0      # days, ramp start
  BFRC_TEND: 0.0      # days, ramp end


initial:
  ocean_time_seconds: 0.0   # time stamp for the IC file

  # Temperature profile
  temp_T0: 20.0     # Surface temperatur
  temp_dT: 10.0    # temperature change across thermocline
  temp_zt: 40.0     # depth of thermocline center
  temp_ht: 10.0     # thickness of thermocline

  # Salinity (constant)
  salt_S0: 35.0

  # velocity
  ubar0: 0.1      # start from steady state